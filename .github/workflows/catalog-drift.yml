name: Live catalog drift

# The scanner can change the checkpoint catalog without a change in this repo.
# This job fails when the skills no longer match the live catalog.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Check skills against the live checkpoint catalog
        run: node scripts/sync-checkpoints.mjs --check
